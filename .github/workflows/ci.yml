# Tests on every push/PR; a v* tag that matches plugin.cfg becomes a GitHub Release.
# Games' editors (and update.gd) install only from Releases, so a broken core never reaches them.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        godot: ['4.3', '4.7']   # oldest supported, newest in use
    steps:
      - uses: actions/checkout@v4
      - name: Godot ${{ matrix.godot }}
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}-stable/Godot_v${{ matrix.godot }}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v*_linux.x86_64 godot && rm godot.zip
      - name: Versions agree
        run: |
          v=$(sed -n 's/^version="\(.*\)"$/\1/p' addons/streamember/plugin.cfg)
          grep -q "^const VERSION := \"$v\"" addons/streamember/streamember.gd || { echo "streamember.gd VERSION != $v"; exit 1; }
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then echo "tag != plugin.cfg $v"; exit 1; fi
      - run: ./godot --headless --path . --import || true
      - run: ./godot --headless --path . -s res://tests/run_tests.gd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets && GODOT="$PWD/godot" bash tests/e2e/run.sh

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF#refs/tags/v}"
          awk -v h="## $v " 'index($0, h) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          zip -qr "streamember-godot-$v.zip" addons/streamember
          gh release create "v$v" "streamember-godot-$v.zip" --title "StreamEmber Live $v" --notes-file notes.md
